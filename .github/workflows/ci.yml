name: CI (native)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swimcenter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Audit and production build
    # This public repository must only run owner-controlled code on the Mac.
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, swimcenter-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run native audit and build
        run: npm run ci:quality

  tests:
    name: Tests (${{ matrix.shard }}/2, 2 workers)
    needs: quality
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, swimcenter-ci]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run native test shard with two workers
        run: npm run ci:test -- "${{ matrix.shard }}/2"

  status:
    name: CI
    needs: [quality, tests]
    if: >-
      always() && github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, swimcenter-ci]
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TESTS_RESULT" = success
